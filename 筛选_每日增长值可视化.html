function drawPoint(i){const p=canvas._plot,dpr=p.dpr;ctx.setTransform(dpr,0,0,dpr,0,0);const x=p.L+i/Math.max(1,p.vals.length-1)*p.pw,y=p.T+(p.hi-p.vals[i])/(p.hi-p.lo)*p.ph;ctx.fillStyle='#fff';ctx.strokeStyle='#2563eb';ctx.lineWidth=2;ctx.beginPath();ctx.arc(x,y,4,0,Math.PI*2);ctx.fill();ctx.stroke()}
canvas.addEventListener('mouseleave',()=>{tip.style.display='none';draw()});select.addEventListener('change',draw);checkbox.addEventListener('change',draw);window.addEventListener('resize',draw);draw();
</script></body></html>
