<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>人民币汇率可视化</title>
<style>
:root{color-scheme:light;--ink:#172b4d;--muted:#667085;--line:#e4e9f0;--blue:#276ef1;--bg:#f4f7fb}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Microsoft YaHei",system-ui,sans-serif}
main{max-width:1180px;margin:32px auto;padding:0 20px}
.panel{background:#fff;border:1px solid var(--line);border-radius:16px;box-shadow:0 8px 26px rgba(27,52,87,.06);padding:24px}
h1{font-size:26px;margin:0 0 8px}
.subtitle{color:var(--muted);font-size:14px;margin-bottom:22px}
.filters{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:16px}
.filter{display:flex;align-items:center;gap:8px;padding:9px 13px;border:1px solid var(--line);border-radius:10px;cursor:pointer;user-select:none;font-size:14px}
.filter.active{border-color:var(--c);background:var(--tint)}
.filter input{accent-color:var(--c);width:16px;height:16px;margin:0}
.actions{display:flex;gap:8px;margin:0 0 12px}
.actions button{border:1px solid var(--line);background:#fff;border-radius:8px;padding:7px 12px;color:#344054;cursor:pointer}
.actions button:hover{border-color:#9bb8f5;color:var(--blue)}
.range{color:var(--muted);font-size:13px;margin:0 0 8px}
.chart-wrap{position:relative;width:100%;overflow:hidden}
.chart{display:block;width:100%;height:auto;min-height:320px}
.grid{stroke:#e9edf3;stroke-width:1}
.axis{stroke:#98a2b3;stroke-width:1}
.tick{fill:#667085;font-size:13px}
.axis-title{fill:#475467;font-size:13px}
.series-line{fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.crosshair{stroke:#667085;stroke-width:1;stroke-dasharray:4 4;display:none}
.marker{stroke:white;stroke-width:2;display:none}
.tooltip{position:absolute;display:none;pointer-events:none;background:rgba(20,32,51,.94);color:#fff;border-radius:8px;padding:10px 12px;font-size:12px;line-height:1.6;box-shadow:0 4px 16px #13223833;z-index:2;max-width:260px}
.legend{display:flex;flex-wrap:wrap;gap:14px;margin:8px 0 0;padding:0;list-style:none;color:#475467;font-size:13px}
.legend li{display:flex;align-items:center;gap:6px}
.swatch{width:12px;height:3px;border-radius:2px}
.note{margin:18px 0 0;padding:13px 15px;background:#f7f9fc;border-left:3px solid var(--blue);color:#475467;font-size:14px;line-height:1.7}
.empty{height:320px;display:grid;place-items:center;color:var(--muted);font-size:15px}
.foot{color:#98a2b3;font-size:12px;margin:14px 0 0}
@media(max-width:640px){main{margin:16px auto;padding:0 12px}.panel{padding:16px 12px}h1{font-size:22px}.tick{font-size:11px}.chart{min-height:260px}.filter{padding:8px 10px}.note{font-size:13px}}
</style>
</head>
<body>
<main><section class="panel">
<h1>人民币汇率走势</h1>
<div class="subtitle">数据来源：中国人民银行官网；按日期查看汇率变化，可同时筛选多个币种。</div>
<div id="filters" class="filters" aria-label="筛选币种"></div>
<div class="actions"><button id="select-all" type="button">全选</button><button id="clear-all" type="button">清空</button></div>
<div id="range" class="range"></div>
<div id="chart-wrap" class="chart-wrap"><svg id="chart" class="chart" viewBox="0 0 1100 520" role="img" aria-label="人民币汇率折线图"></svg><div id="tooltip" class="tooltip"></div></div>
<ul id="legend" class="legend" aria-label="图例"></ul>
<div id="note" class="note"></div>
<div class="foot">数值沿用 Excel 原始报价；例如日元按“人民币元/100日元”记录。悬停图表可查看具体日期和汇率。</div>
</section></main>
