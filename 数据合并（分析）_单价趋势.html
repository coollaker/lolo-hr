<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>拍卖单价趋势</title>
  <style>
    :root {
      color-scheme: light;
      --paper: #f3f6f2;
      --surface: #fff;
      --ink: #20302b;
      --muted: #6d7a73;
      --line: #dce5dd;
      --grid: #e8eee8;
      --green: #27765e;
      --orange: #c86845;
    }
    * { box-sizing: border-box; }
    body { margin: 0; color: var(--ink); background: var(--paper); font-family: "Microsoft YaHei", "PingFang SC", sans-serif; }
    .page { width: min(1180px, calc(100% - 48px)); margin: 0 auto; padding: 48px 0 56px; }
    header { display: flex; align-items: flex-end; justify-content: space-between; gap: 24px; margin-bottom: 30px; }
    .eyebrow { display: flex; align-items: center; gap: 9px; color: var(--green); font-size: 12px; font-weight: 700; }
    .eyebrow::before { width: 8px; height: 8px; border-radius: 50%; background: var(--orange); content: ""; }
    h1 { margin: 9px 0 0; font: 500 36px/1.2 Georgia, "Noto Serif SC", serif; }
    .subtitle { margin: 10px 0 0; color: var(--muted); font-size: 13px; }
    .unit-mark { padding: 9px 12px; border-left: 2px solid var(--orange); color: var(--muted); font-size: 12px; white-space: nowrap; }
    .toolbar { display: grid; grid-template-columns: minmax(240px, 1.7fr) minmax(150px, 1fr) minmax(150px, 1fr) auto; gap: 12px; align-items: end; padding: 18px 20px; background: var(--surface); border: 1px solid var(--line); border-radius: 6px; }
    .filter { display: grid; gap: 7px; min-width: 0; }
    .filter label { color: var(--muted); font-size: 11px; font-weight: 700; }
    select, button { height: 40px; border: 1px solid var(--line); border-radius: 4px; background: #fff; color: var(--ink); font: inherit; font-size: 13px; }
    select { width: 100%; padding: 0 32px 0 11px; }
    select:focus, button:focus-visible { outline: 2px solid var(--green); outline-offset: 2px; }
    button { padding: 0 15px; cursor: pointer; }
    button:hover { border-color: var(--green); color: var(--green); }
    .summary { display: flex; align-items: center; gap: 28px; min-height: 84px; padding: 18px 4px 14px; }
    .metric { display: grid; gap: 5px; }
    .metric-label { color: var(--muted); font-size: 11px; }
    .metric-value { font: 500 21px/1.1 Georgia, "Noto Serif SC", serif; font-variant-numeric: tabular-nums; }
    .metric-value small { margin-left: 4px; color: var(--muted); font: 12px "Microsoft YaHei", "PingFang SC", sans-serif; }
    .chart-panel { overflow: hidden; background: var(--surface); border: 1px solid var(--line); border-radius: 6px; }
    .chart-head { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 18px 22px 10px; }
    .chart-title { margin: 0; font-size: 14px; font-weight: 700; }
    .chart-note { color: var(--muted); font-size: 11px; }
    .chart-wrap { position: relative; padding: 0 8px 8px; }
    svg { display: block; width: 100%; height: auto; overflow: visible; }
    .axis-label { fill: var(--muted); font: 11px "Microsoft YaHei", "PingFang SC", sans-serif; }
    .empty { position: absolute; inset: 20px 0 50px; display: grid; place-items: center; color: var(--muted); font-size: 13px; pointer-events: none; }
    .tooltip { position: fixed; z-index: 3; display: none; max-width: 240px; padding: 10px 12px; border: 1px solid #d5e0d7; border-radius: 4px; background: #fff; box-shadow: 0 8px 24px #20302b1a; color: var(--ink); font-size: 12px; line-height: 1.7; pointer-events: none; }
    .tooltip strong { display: block; font-size: 13px; }
    footer { display: flex; justify-content: space-between; gap: 18px; padding: 13px 2px 0; color: var(--muted); font-size: 11px; }
    @media (max-width: 720px) {
      .page { width: min(100% - 28px, 560px); padding-top: 30px; }
      header { align-items: flex-start; margin-bottom: 22px; }
      h1 { font-size: 30px; }
      .unit-mark { margin-top: 25px; padding-right: 0; }
      .toolbar { grid-template-columns: 1fr 1fr; padding: 14px; }
      .filter:first-child { grid-column: 1 / -1; }
      .toolbar button { align-self: end; }
      .summary { justify-content: space-between; gap: 12px; padding: 18px 2px; }
      .metric-value { font-size: 18px; }
      .chart-head { align-items: flex-start; padding: 16px 14px 8px; }
      .chart-note { max-width: 45%; text-align: right; line-height: 1.5; }
      .chart-wrap { padding: 0 3px 4px; }
      footer { flex-direction: column; gap: 6px; }
    }
    @media (max-width: 390px) {
      .page { width: calc(100% - 20px); }
      .unit-mark { font-size: 11px; }
      .summary { gap: 8px; }
      .metric-value { font-size: 16px; }
      .metric-value small { font-size: 10px; }
    }
  </style>
</head>
<body>
  <main class="page">
    <header>
      <div>
        <div class="eyebrow">拍卖数据分析</div>
        <h1>单价趋势</h1>
        <p class="subtitle">按拍卖日期观察房产单价变化</p>
      </div>
      <div class="unit-mark">Y 轴 · 单价（万元）</div>
    </header>
    <section class="toolbar" aria-label="数据筛选">
      <div class="filter"><label for="community">小区 / 项目</label><select id="community"><option value="">全部小区 / 项目</option></select></div>
      <div class="filter"><label for="result">结果</label><select id="result"><option value="">全部结果</option></select></div>
      <div class="filter"><label for="status">状态</label><select id="status"><option value="">全部状态</option></select></div>
      <button id="reset" type="button" title="清除全部筛选">重置筛选</button>
    </section>
    <section class="summary" aria-live="polite">
      <div class="metric"><span class="metric-label">符合条件记录</span><strong class="metric-value" id="recordCount">—</strong></div>
      <div class="metric"><span class="metric-label">平均单价</span><strong class="metric-value" id="averagePrice">—</strong></div>
      <div class="metric"><span class="metric-label">日期范围</span><strong class="metric-value" id="dateRange">—</strong></div>
    </section>
    <section class="chart-panel">
      <div class="chart-head"><h2 class="chart-title">每日平均单价</h2><span class="chart-note" id="pointCount">按日期汇总</span></div>
      <div class="chart-wrap">
        <svg id="chart" viewBox="0 0 1000 470" role="img" aria-label="按日期变化的平均单价折线图"></svg>
        <div class="empty" id="empty" hidden>当前筛选条件下没有可显示的数据</div>
      </div>
    </section>
    <footer><span>同一日期多条记录按单价取平均；日期为空的记录不参与图表。</span><span id="sourceCount"></span></footer>
  </main>
  <div class="tooltip" id="tooltip" role="status"></div>

    const binary = atob(DATA_B64);
    const compressed = Uint8Array.from(binary, character => character.charCodeAt(0));
    const dataStream = new Blob([compressed]).stream().pipeThrough(new DecompressionStream('deflate'));
    new Response(dataStream).json().then(data => initialize(data)).catch(() => {
      document.getElementById('empty').hidden = false;
      document.getElementById('empty').textContent = '数据加载失败，请使用新版 Chrome、Edge 或 Firefox 打开。';
    });

    function initialize(rawData) {
      const DATA = rawData.map(([date, community, result, status, price]) => ({ date, community, result, status, price }));
      const svg = document.getElementById('chart');
      const tooltip = document.getElementById('tooltip');
      const filters = ['community', 'result', 'status'];
      const numberFormat = new Intl.NumberFormat('zh-CN', { maximumFractionDigits: 3 });

      function populateFilter(id, key) {
        const select = document.getElementById(id);
        const values = [...new Set(DATA.map(row => row[key]).filter(Boolean))].sort((a, b) => a.localeCompare(b, 'zh-CN'));
        for (const value of values) {
          const option = document.createElement('option');
          option.value = value;
          option.textContent = value;
          select.append(option);
        }
        select.addEventListener('change', render);
      }

      function niceStep(raw) {
        const magnitude = 10 ** Math.floor(Math.log10(raw || 1));
        const fraction = raw / magnitude;
        return (fraction <= 1 ? 1 : fraction <= 2 ? 2 : fraction <= 5 ? 5 : 10) * magnitude;
      }

      function makeSvgElement(name, attrs = {}) {
        const element = document.createElementNS('http://www.w3.org/2000/svg', name);
        for (const [key, value] of Object.entries(attrs)) element.setAttribute(key, value);
        return element;
      }

      function render() {
        const selected = Object.fromEntries(filters.map(id => [id, document.getElementById(id).value]));
        const rows = DATA.filter(row => filters.every(id => !selected[id] || row[id] === selected[id]));
        const buckets = new Map();
        for (const row of rows) {
          const value = buckets.get(row.date) || { sum: 0, count: 0 };
          value.sum += row.price;
          value.count += 1;
          buckets.set(row.date, value);
        }
        const points = [...buckets.entries()].sort(([a], [b]) => a.localeCompare(b)).map(([date, value]) => ({ date, price: value.sum / value.count, count: value.count }));
        const average = rows.length ? rows.reduce((sum, row) => sum + row.price, 0) / rows.length : null;
        document.getElementById('recordCount').textContent = numberFormat.format(rows.length);
        document.getElementById('averagePrice').innerHTML = average === null ? '—' : `${numberFormat.format(average)}<small>万元</small>`;
        document.getElementById('dateRange').textContent = points.length ? `${points[0].date} — ${points[points.length - 1].date}` : '—';
        document.getElementById('pointCount').textContent = `${points.length} 个日期点`;
        document.getElementById('empty').hidden = points.length > 0;
        document.getElementById('sourceCount').textContent = `图表有效记录 ${DATA.length} 条`;
        drawChart(points);
      }

      function drawChart(points) {
        svg.replaceChildren();
        if (!points.length) return;
        const width = 1000, height = 470, left = 76, right = 26, top = 24, bottom = 54;
        const plotWidth = width - left - right, plotHeight = height - top - bottom;
        const minPrice = Math.min(...points.map(point => point.price));
        const maxPrice = Math.max(...points.map(point => point.price));
        const step = niceStep((maxPrice - minPrice) / 4 || maxPrice / 4 || 1);
        const padding = (maxPrice - minPrice || step) * 0.12;
        const low = Math.max(0, Math.floor((minPrice - padding) / step) * step);
        const high = Math.ceil((maxPrice + padding) / step) * step || low + step;
        const times = points.map(point => Date.parse(`${point.date}T00:00:00`));
        const firstTime = times[0], lastTime = times[times.length - 1];
        const x = time => left + (lastTime === firstTime ? plotWidth / 2 : (time - firstTime) / (lastTime - firstTime) * plotWidth);
        const y = price => top + (high - price) / (high - low) * plotHeight;

        for (let value = low; value <= high + step * 0.001; value += step) {
          const position = y(value);
          svg.append(makeSvgElement('line', { x1: left, x2: width - right, y1: position, y2: position, stroke: '#e8eee8', 'stroke-width': 1 }));
          const label = makeSvgElement('text', { x: left - 12, y: position + 4, 'text-anchor': 'end', class: 'axis-label' });
          label.textContent = numberFormat.format(value);
          svg.append(label);
        }

        const tickCount = Math.min(6, points.length);
        for (let index = 0; index < tickCount; index++) {
          const pointIndex = Math.round(index * (points.length - 1) / Math.max(1, tickCount - 1));
          const label = makeSvgElement('text', { x: x(times[pointIndex]), y: height - 19, 'text-anchor': index === 0 ? 'start' : index === tickCount - 1 ? 'end' : 'middle', class: 'axis-label' });
          label.textContent = points[pointIndex].date.slice(0, 7);
          svg.append(label);
        }

        const path = points.map((point, index) => `${index ? 'L' : 'M'}${x(times[index]).toFixed(2)},${y(point.price).toFixed(2)}`).join(' ');
        svg.append(makeSvgElement('path', { d: path, fill: 'none', stroke: '#27765e', 'stroke-width': 2.5, 'stroke-linecap': 'round', 'stroke-linejoin': 'round', 'vector-effect': 'non-scaling-stroke' }));

        for (let index = 0; index < points.length; index++) {
          const point = points[index], cx = x(times[index]), cy = y(point.price);
          const hit = makeSvgElement('circle', { cx, cy, r: 10, fill: 'transparent', tabindex: 0, 'aria-label': `${point.date}，平均单价 ${numberFormat.format(point.price)} 万元，${point.count} 条记录` });
          const dot = makeSvgElement('circle', { cx, cy, r: 3, fill: '#fff', stroke: '#27765e', 'stroke-width': 2, 'pointer-events': 'none' });
          const showTooltip = event => {
            tooltip.replaceChildren();
            const title = document.createElement('strong');
            title.textContent = point.date;
            tooltip.append(title, `平均单价 ${numberFormat.format(point.price)} 万元`, document.createElement('br'), `记录数 ${point.count} 条`);
            tooltip.style.display = 'block';
            const rect = hit.getBoundingClientRect();
            const leftPosition = event.clientX || rect.left;
            const topPosition = event.clientY || rect.top;
            tooltip.style.left = `${Math.min(window.innerWidth - 250, Math.max(8, leftPosition + 12))}px`;
            tooltip.style.top = `${Math.max(8, topPosition - 62)}px`;
          };
          hit.addEventListener('pointerenter', showTooltip);
          hit.addEventListener('pointermove', showTooltip);
          hit.addEventListener('pointerleave', () => { tooltip.style.display = 'none'; });
          hit.addEventListener('focus', showTooltip);
          hit.addEventListener('blur', () => { tooltip.style.display = 'none'; });
          svg.append(hit, dot);
        }
      }

      populateFilter('community', 'community');
      populateFilter('result', 'result');
      populateFilter('status', 'status');
      document.getElementById('reset').addEventListener('click', () => {
        for (const id of filters) document.getElementById(id).value = '';
        render();
      });
      render();
    }
  </script>
</body>
</html>
